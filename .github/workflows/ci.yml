name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ruff black
      # Lint everything that ships, not just src/ — tools/ and run.py are
      # shipped entry points too.
      - run: ruff check src/ tests/ tools/ run.py
      - run: black --check src/ tests/ tools/ run.py

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/job_scraper/ || true # advisory until codebase typed

  python-test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=src --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  config-validation:
    name: Validate shipped configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "."
      # Every config in configs/ must load under the strict validator, so a
      # typo in a shipped config fails the PR rather than a user's run.
      - name: Load every config
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "src")
          from job_scraper.config import load_config
          from general_scraper.config import load_general_config
          failed = []
          for path in sorted(pathlib.Path("configs").rglob("*.yaml")):
              loader = load_general_config if "general" in path.name else load_config
              try:
                  loader(str(path))
                  print(f"OK   {path}")
              except Exception as exc:
                  failed.append(f"{path}: {type(exc).__name__}: {exc}")
                  print(f"FAIL {path}: {exc}")
          if failed:
              sys.exit("\n".join(failed))
          PY

  extension:
    name: Extension (build + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/

  security-audit:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --ignore-vuln GHSA-w3h3-4rj7-4ph4 || true
