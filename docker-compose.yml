# docker-compose for local development / scheduled scraping.
#
# Usage:
#   docker compose run --rm harvestkit --config example
#   docker compose run --rm harvestkit --config norway-top5 --confirm-permission
#   docker compose run --rm harvestkit --general --config general.example
#
# Mounts:
#   - ./configs   → /app/configs    (your YAML files; shadows the baked-in copy)
#   - ./output    → /app/output     (CSV / JSON outputs)
#   - ./.cache    → /app/.cache     (SQLite HTTP + LLM cache)
services:
  harvestkit:
    build:
      context: .
      target: playwright
    image: harvestkit:local
    volumes:
      - ./configs:/app/configs:ro
      - ./output:/app/output
      - ./.cache:/app/.cache
    environment:
      # Set in a .env file or your shell — never commit secrets
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    command: ["--help"]
